name: Publish compatibility watcher image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-compat-watcher.yml'
      - 'compat/watcher/**'

concurrency:
  group: publish-compat-watcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish compatibility watcher
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: compat/watcher/Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/df-wu/ddns-openvpn-proxy-watcher:latest
            ghcr.io/df-wu/ddns-openvpn-proxy-watcher:compat-${{ github.sha }}
          provenance: false
          sbom: false
