name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/ci.yml'
      - 'docker-compose.yml'
      - '.env.example'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'Makefile'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/ci.yml'
      - 'docker-compose.yml'
      - '.env.example'
      - '.markdownlint-cli2.jsonc'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'Makefile'
      - 'README.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Check shell scripts
        run: |
          shellcheck -s sh scripts/*.sh tests/*.sh
          shellcheck -s bash compat/watcher/*.sh

      - name: Validate and test repository
        run: make check
