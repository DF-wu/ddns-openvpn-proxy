# OpenConnect profile in `openconnect --config` format: one long option per
# line without the leading dashes. Empty lines and # comments are ignored.
#
# The gateway hostname and port are NOT part of this file; set
# OPENCONNECT_SERVER / OPENCONNECT_PORT in .env. Username and password come
# from OPENCONNECT_USER / OPENCONNECT_PASSWORD. The helper appends
# `resolve=HOST:IP` and `non-inter` when rendering the runtime profile, so do
# not set config, resolve, user, passwd-on-stdin, cookie-on-stdin, background,
# interface, or script-tun here.

# anyconnect (Cisco AnyConnect / ocserv, default), nc, gp, pulse, f5, fortinet, array
protocol=anyconnect

# Pin the gateway certificate (recommended for self-hosted ocserv) or provide
# the CA bundle as a file next to this profile.
#servercert=pin-sha256:REPLACE_WITH_THE_GATEWAY_CERTIFICATE_PIN
#cafile=ca.pem

# Common tuning
#authgroup=REPLACE_WITH_GROUP
#no-dtls
#disable-ipv6
#useragent=AnyConnect
