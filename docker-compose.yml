name: ${COMPOSE_PROJECT_NAME:-ddns-openvpn-proxy}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-ddns-common: &ddns-common
  image: ${DDNS_HELPER_IMAGE:-docker:29.6.1-cli-alpine3.24}
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - DAC_READ_SEARCH
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=8m,mode=1777
  logging: *default-logging
  volumes:
    - ${VPN_CONFIG_DIR:-${OPENVPN_CONFIG_DIR:-./config/openvpn}}:/source:ro
    - vpn-state:/state
    - ./scripts/ddns-openvpn.sh:/opt/ddns/ddns-openvpn.sh:ro
  environment: &ddns-environment
    TZ: ${TZ:-UTC}
    VPN_TYPE: ${VPN_TYPE:-openvpn}
    VPN_SOURCE_CONFIG: /source/${VPN_CONFIG_FILE:-${OPENVPN_CONFIG_FILE:-client.ovpn}}
    VPN_RENDERED_CONFIG: /state/runtime/vpn.conf
    STATE_DIR: /state
    DDNS_HOSTNAME: ${DDNS_HOSTNAME:-}
    DDNS_RESOLVER: ${DDNS_RESOLVER:-}
    DDNS_POLL_SECONDS: ${DDNS_POLL_SECONDS:-60}
    DDNS_INIT_RETRY_SECONDS: ${DDNS_INIT_RETRY_SECONDS:-5}
    DDNS_OVERRIDE_IPS: ${DDNS_OVERRIDE_IPS:-}
    OPENVPN_USER_CONFIGURED: ${OPENVPN_USER:+1}
    OPENVPN_PASSWORD_CONFIGURED: ${OPENVPN_PASSWORD:+1}
    HTTPPROXY_ENABLED: ${HTTPPROXY:-on}
    HTTPPROXY_USER_CONFIGURED: ${HTTPPROXY_USER:+1}
    HTTPPROXY_PASSWORD_CONFIGURED: ${HTTPPROXY_PASSWORD:+1}
    SOCKS5_USER_CONFIGURED: ${SOCKS5_USER:+1}
    SOCKS5_PASSWORD_CONFIGURED: ${SOCKS5_PASSWORD:+1}
    PROXY_BIND_ADDRESS: ${PROXY_BIND_ADDRESS:-127.0.0.1}
    GLUETUN_CONTAINER_NAME: ${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}
    GLUETUN_RESTART_TIMEOUT_SECONDS: ${GLUETUN_RESTART_TIMEOUT_SECONDS:-20}
  entrypoint:
    - /bin/sh
    - /opt/ddns/ddns-openvpn.sh

services:
  # One-shot gate: Gluetun never starts with a stale or hostname-based profile.
  ddns-init:
    <<: *ddns-common
    command:
      - init
    restart: "no"

  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.41.1}
    container_name: ${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      ddns-init:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${HTTP_PROXY_PORT:-8888}:8888/tcp"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${SOCKS5_PROXY_PORT:-1080}:1080/tcp"
    volumes:
      - ${VPN_CONFIG_DIR:-${OPENVPN_CONFIG_DIR:-./config/openvpn}}:/source:ro
      - vpn-state:/state:ro
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_CUSTOM_CONFIG: /state/runtime/vpn.conf
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      OPENVPN_VERBOSITY: ${OPENVPN_VERBOSITY:-1}
      WIREGUARD_CONF_SECRETFILE: /state/runtime/vpn.conf
      WIREGUARD_ALLOWED_IPS: ${WIREGUARD_ALLOWED_IPS:-0.0.0.0/0}
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: ${WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL:-0}
      WIREGUARD_MTU: ${WIREGUARD_MTU:-1320}
      WIREGUARD_IMPLEMENTATION: ${WIREGUARD_IMPLEMENTATION:-auto}
      HEALTH_RESTART_VPN: "on"
      HTTPPROXY: ${HTTPPROXY:-on}
      HTTPPROXY_LISTENING_ADDRESS: :8888
      HTTPPROXY_USER: ${HTTPPROXY_USER:-}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD:-}
      HTTPPROXY_STEALTH: ${HTTPPROXY_STEALTH:-off}
      # vproxy shares this namespace; Gluetun must admit its listener.
      FIREWALL_INPUT_PORTS: "1080"

  vproxy:
    image: ${VPROXY_IMAGE:-ghcr.io/0x676e67/vproxy:v2.5.5}
    network_mode: service:gluetun
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging: *default-logging
    environment:
      SOCKS5_USER: ${SOCKS5_USER:-}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:-}
      VPROXY_LOG: ${VPROXY_LOG:-info}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        if [ -n "$${SOCKS5_USER}" ] && [ -n "$${SOCKS5_PASSWORD}" ]; then
          exec /bin/vproxy run --bind 0.0.0.0:1080 socks5 -u "$${SOCKS5_USER}" -p "$${SOCKS5_PASSWORD}"
        elif [ -z "$${SOCKS5_USER}" ] && [ -z "$${SOCKS5_PASSWORD}" ]; then
          exec /bin/vproxy run --bind 0.0.0.0:1080 socks5
        else
          echo "ERROR: SOCKS5_USER and SOCKS5_PASSWORD must both be set or both be empty" >&2
          exit 64
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 1080
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Restrict the helper to Docker's restart endpoint instead of mounting the
  # host socket directly into the DDNS watcher.
  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:v0.4.2}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/socket-proxy-haproxy.cfg.tmpl:/usr/local/etc/haproxy/restart-only.cfg.tmpl:ro
    environment:
      LOG_LEVEL: warning
      RESTART_CONTAINER_NAME: ${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${RESTART_CONTAINER_NAME}" in
          ""|*[!a-zA-Z0-9_.-]*)
            echo "ERROR: invalid RESTART_CONTAINER_NAME" >&2
            exit 64
            ;;
        esac
        sed "s/@RESTART_CONTAINER_NAME@/$${RESTART_CONTAINER_NAME}/g" \
          /usr/local/etc/haproxy/restart-only.cfg.tmpl \
          > /tmp/restart-only.cfg
        exec haproxy -W -db -f /tmp/restart-only.cfg
    networks:
      - docker-api
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:2375/_ping
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ddns-watcher:
    <<: *ddns-common
    command:
      - watch
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
      docker-socket-proxy:
        condition: service_healthy
    environment:
      <<: *ddns-environment
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks:
      - default
      - docker-api
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - /opt/ddns/ddns-openvpn.sh
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  docker-api:
    internal: true

volumes:
  vpn-state:
