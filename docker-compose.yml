services:
  ddns-init:
    image: ${WATCHER_IMAGE:-ghcr.io/df-wu/ddns-openvpn-proxy-watcher:latest}
    restart: "no"
    volumes:
      - ${OPENVPN_CONFIG_DIR:-./config}:/gluetun/source:ro
      - ${STATE_DIR:-./state}:/gluetun/state
    environment:
      TZ: ${TZ:-UTC}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_SOURCE_CONFIG: ${OPENVPN_SOURCE_CONFIG:-}
      OPENVPN_SOURCE_DIR: /gluetun/source/openvpn
      OPENVPN_RENDERED_CONFIG: /gluetun/state/openvpn/current.ovpn
      WIREGUARD_SOURCE_CONFIG: ${WIREGUARD_SOURCE_CONFIG:-}
      WIREGUARD_SOURCE_DIR: /gluetun/source/wireguard
      WIREGUARD_RENDERED_CONFIG: /gluetun/state/wireguard/wg0.conf
      DDNS_HOSTNAME: ${DDNS_HOSTNAME:-}
      DDNS_POLL_SECONDS: ${DDNS_POLL_SECONDS:-60}
      DDNS_COOLDOWN_SECONDS: ${DDNS_COOLDOWN_SECONDS:-15}
      DDNS_INIT_RETRY_SECONDS: ${DDNS_INIT_RETRY_SECONDS:-5}
      DDNS_INIT_MAX_ATTEMPTS: ${DDNS_INIT_MAX_ATTEMPTS:-0}
      DDNS_RESOLVER: ${DDNS_RESOLVER:-}
      DDNS_OVERRIDE_IP: ${DDNS_OVERRIDE_IP:-}
      STATE_DIR: /gluetun/state
    entrypoint: ["/app/scripts/ddns-init.sh"]

  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:latest}
    container_name: ${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}
    restart: unless-stopped
    depends_on:
      ddns-init:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PROXY_PORT:-8888}:8888/tcp"
      - "${SOCKS5_PROXY_PORT:-1080}:1080/tcp"
    volumes:
      - ${OPENVPN_CONFIG_DIR:-./config}:/gluetun/source:ro
      - ${STATE_DIR:-./state}:/gluetun/state
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_CUSTOM_CONFIG: /gluetun/state/openvpn/current.ovpn
      WIREGUARD_CUSTOM_CONFIG: /gluetun/state/wireguard/wg0.conf
      HTTPPROXY: on
      HTTPPROXY_LISTENING_ADDRESS: :8888
      HTTPPROXY_USER: ${HTTPPROXY_USER:-}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD:-}
      HTTPPROXY_STEALTH: ${HTTPPROXY_STEALTH:-off}

  vproxy:
    image: ${VPROXY_IMAGE:-ghcr.io/0x676e67/vproxy:latest}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: |
      if [ -n "$${SOCKS5_USER}" ] && [ -n "$${SOCKS5_PASSWORD}" ]; then
        exec vproxy run --bind 0.0.0.0:1080 socks5 -u "$${SOCKS5_USER}" -p "$${SOCKS5_PASSWORD}"
      else
        exec vproxy run --bind 0.0.0.0:1080 socks5
      fi

  ddns-watcher:
    image: ${WATCHER_IMAGE:-ghcr.io/df-wu/ddns-openvpn-proxy-watcher:latest}
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
    volumes:
      - ${OPENVPN_CONFIG_DIR:-./config}:/gluetun/source:ro
      - ${STATE_DIR:-./state}:/gluetun/state
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-UTC}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_SOURCE_CONFIG: ${OPENVPN_SOURCE_CONFIG:-}
      OPENVPN_SOURCE_DIR: /gluetun/source/openvpn
      OPENVPN_RENDERED_CONFIG: /gluetun/state/openvpn/current.ovpn
      WIREGUARD_SOURCE_CONFIG: ${WIREGUARD_SOURCE_CONFIG:-}
      WIREGUARD_SOURCE_DIR: /gluetun/source/wireguard
      WIREGUARD_RENDERED_CONFIG: /gluetun/state/wireguard/wg0.conf
      DDNS_HOSTNAME: ${DDNS_HOSTNAME:-}
      DDNS_POLL_SECONDS: ${DDNS_POLL_SECONDS:-60}
      DDNS_COOLDOWN_SECONDS: ${DDNS_COOLDOWN_SECONDS:-15}
      DDNS_RESOLVER: ${DDNS_RESOLVER:-}
      DDNS_OVERRIDE_IP: ${DDNS_OVERRIDE_IP:-}
      GLUETUN_CONTAINER_NAME: ${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}
      STATE_DIR: /gluetun/state
