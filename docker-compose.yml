# Gluetun backend stack (default): OpenVPN or WireGuard via Gluetun, HTTP proxy
# from Gluetun, SOCKS5 from the vproxy sidecar. Other backends live in
# docker-compose.<backend>.yml; shared services come from compose/core.yml.
name: ${COMPOSE_PROJECT_NAME:-ddns-openvpn-proxy}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-helper-environment: &helper-environment
  VPN_BACKEND: gluetun
  VPN_TYPE: ${VPN_TYPE:-openvpn}
  VPN_SOURCE_CONFIG: /source/${VPN_CONFIG_FILE:-${OPENVPN_CONFIG_FILE:-client.ovpn}}
  VPN_CONTAINER_NAME: ${VPN_CONTAINER_NAME:-${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}}
  VPN_HEALTH_PROBE: http://gluetun:9999
  SIDECAR_CONTAINER_NAME: ${VPROXY_CONTAINER_NAME:-ddns-openvpn-vproxy}
  SIDECAR_HEALTH_PROBE: tcp://gluetun:1080

services:
  ddns-init:
    extends:
      file: compose/core.yml
      service: ddns-init
    volumes:
      - ${VPN_CONFIG_DIR:-${OPENVPN_CONFIG_DIR:-./config/openvpn}}:/source:ro
    environment:
      <<: *helper-environment

  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.41.1}
    container_name: ${VPN_CONTAINER_NAME:-${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      ddns-init:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${HTTP_PROXY_PORT:-8888}:8888/tcp"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${SOCKS5_PROXY_PORT:-1080}:1080/tcp"
    volumes:
      - ${VPN_CONFIG_DIR:-${OPENVPN_CONFIG_DIR:-./config/openvpn}}:/source:ro
      - vpn-state:/state:ro
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_CUSTOM_CONFIG: /state/runtime/vpn.conf
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      OPENVPN_VERBOSITY: ${OPENVPN_VERBOSITY:-1}
      WIREGUARD_CONF_SECRETFILE: /state/runtime/vpn.conf
      WIREGUARD_ALLOWED_IPS: ${WIREGUARD_ALLOWED_IPS:-0.0.0.0/0}
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: ${WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL:-0}
      WIREGUARD_MTU: ${WIREGUARD_MTU:-1320}
      WIREGUARD_IMPLEMENTATION: ${WIREGUARD_IMPLEMENTATION:-auto}
      HEALTH_RESTART_VPN: "on"
      HEALTH_SERVER_ADDRESS: :9999
      HTTPPROXY: ${HTTPPROXY:-on}
      HTTPPROXY_LISTENING_ADDRESS: :8888
      HTTPPROXY_USER: ${HTTPPROXY_USER:-}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD:-}
      # Transparency contract (not configurable): without stealth Gluetun
      # adds X-Forwarded-For with the client IP to every plain-HTTP request,
      # and the request log would record every destination.
      HTTPPROXY_STEALTH: "on"
      HTTPPROXY_LOG: "off"
      # Transparent, quiet, low-footprint defaults: no DNS answer rewriting
      # (and no blocklist download or in-memory list), no third-party
      # public-IP or version lookups on each (re)connect, and no 7 MB
      # servers.json written into the container layer (custom provider only).
      BLOCK_MALICIOUS: ${BLOCK_MALICIOUS:-off}
      PUBLICIP_ENABLED: ${PUBLICIP_ENABLED:-off}
      VERSION_INFORMATION: "off"
      STORAGE_FILEPATH: ""
      # vproxy shares this namespace; Gluetun must admit its listener and the
      # watcher's health probe.
      FIREWALL_INPUT_PORTS: "1080,9999"
    # The image healthcheck (kept) runs every 5s, each a runc exec of the
    # 24 MB gluetun binary. HEALTH_RESTART_VPN already self-heals the tunnel,
    # so Docker only needs a slow status probe after start-up.
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  vproxy:
    image: ${VPROXY_IMAGE:-ghcr.io/0x676e67/vproxy:v2.5.5}
    container_name: ${VPROXY_CONTAINER_NAME:-ddns-openvpn-vproxy}
    network_mode: service:gluetun
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging: *default-logging
    environment:
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      SOCKS5_USER: ${SOCKS5_USER:-}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:-}
      # info logs every destination (3 lines per connection).
      VPROXY_LOG: ${VPROXY_LOG:-warn}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        if [ -n "$${SOCKS5_USER}" ] && [ -n "$${SOCKS5_PASSWORD}" ]; then
          exec /bin/vproxy run --bind 0.0.0.0:1080 socks5 -u "$${SOCKS5_USER}" -p "$${SOCKS5_PASSWORD}"
        elif [ -z "$${SOCKS5_USER}" ] && [ -z "$${SOCKS5_PASSWORD}" ]; then
          exec /bin/vproxy run --bind 0.0.0.0:1080 socks5
        else
          echo "ERROR: SOCKS5_USER and SOCKS5_PASSWORD must both be set or both be empty" >&2
          exit 64
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          interface=tun0;
          [ "$${VPN_TYPE}" != wireguard ] || interface=wg0;
          nc -z 127.0.0.1 1080 &&
          wget -q --spider -T 2 http://127.0.0.1:9999 &&
          test -d "/sys/class/net/$${interface}" &&
          ip -4 route get 1.1.1.1 2>/dev/null | grep -q " dev $${interface} "
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

  docker-socket-proxy:
    extends:
      file: compose/core.yml
      service: docker-socket-proxy
    environment:
      RESTART_TARGETS: "${VPN_CONTAINER_NAME:-${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}} ${VPROXY_CONTAINER_NAME:-ddns-openvpn-vproxy}"

  ddns-watcher:
    extends:
      file: compose/core.yml
      service: ddns-watcher
    depends_on:
      gluetun:
        condition: service_started
      vproxy:
        condition: service_started
      docker-socket-proxy:
        condition: service_healthy
    volumes:
      - ${VPN_CONFIG_DIR:-${OPENVPN_CONFIG_DIR:-./config/openvpn}}:/source:ro
    environment:
      <<: *helper-environment
      DOCKER_HOST: tcp://docker-socket-proxy:2375

networks:
  docker-api:
    internal: true

volumes:
  vpn-state:
