# Shared service definitions for every backend stack. Root-level
# docker-compose*.yml files extend these services; do not run this file
# directly. Relative host paths here are resolved against this directory.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

# DDNS helper: one image, one POSIX script tree, two lifecycles (init/watch).
# It never receives secrets, only *_CONFIGURED presence flags.
x-helper: &helper
  image: ${DDNS_HELPER_IMAGE:-docker:29.6.1-cli-alpine3.24}
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - DAC_READ_SEARCH
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=8m,mode=1777
  logging: *default-logging
  volumes:
    - vpn-state:/state
    - ../scripts:/opt/ddns:ro
  environment:
    TZ: ${TZ:-UTC}
    STATE_DIR: /state
    VPN_RENDERED_CONFIG: /state/runtime/vpn.conf
    VPN_RENDERED_ENV: /state/runtime/vpn.env
    DDNS_HOSTNAME: ${DDNS_HOSTNAME:-}
    DDNS_RESOLVER: ${DDNS_RESOLVER:-}
    DDNS_POLL_SECONDS: ${DDNS_POLL_SECONDS:-60}
    DDNS_INIT_RETRY_SECONDS: ${DDNS_INIT_RETRY_SECONDS:-5}
    DDNS_OVERRIDE_IPS: ${DDNS_OVERRIDE_IPS:-}
    OPENVPN_USER_CONFIGURED: ${OPENVPN_USER:+1}
    OPENVPN_PASSWORD_CONFIGURED: ${OPENVPN_PASSWORD:+1}
    OPENCONNECT_USER_CONFIGURED: ${OPENCONNECT_USER:+1}
    OPENCONNECT_PASSWORD_CONFIGURED: ${OPENCONNECT_PASSWORD:+1}
    HTTPPROXY_ENABLED: ${HTTPPROXY:-on}
    HTTPPROXY_USER_CONFIGURED: ${HTTPPROXY_USER:+1}
    HTTPPROXY_PASSWORD_CONFIGURED: ${HTTPPROXY_PASSWORD:+1}
    SOCKS5_USER_CONFIGURED: ${SOCKS5_USER:+1}
    SOCKS5_PASSWORD_CONFIGURED: ${SOCKS5_PASSWORD:+1}
    PROXY_BIND_ADDRESS: ${PROXY_BIND_ADDRESS:-127.0.0.1}
    VPN_RESTART_TIMEOUT_SECONDS: ${VPN_RESTART_TIMEOUT_SECONDS:-${GLUETUN_RESTART_TIMEOUT_SECONDS:-20}}
    VPN_HEALTH_TIMEOUT_SECONDS: ${VPN_HEALTH_TIMEOUT_SECONDS:-${GLUETUN_HEALTH_TIMEOUT_SECONDS:-120}}
  entrypoint:
    - /bin/sh
    - /opt/ddns/ddns-vpn.sh

services:
  # One-shot gate: the VPN container never starts with a stale or
  # hostname-based profile.
  ddns-init:
    <<: *helper
    command:
      - init
    restart: "no"

  ddns-watcher:
    <<: *helper
    command:
      - watch
    restart: unless-stopped
    networks:
      - default
      - docker-api
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - /opt/ddns/ddns-vpn.sh
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Restrict the watcher to Docker's restart endpoint for the configured
  # targets instead of mounting the host socket into the watcher. The exact
  # HAProxy allowlist is rendered at start from RESTART_TARGETS.
  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:v0.4.2}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../docker/socket-proxy-haproxy.cfg.tmpl:/usr/local/etc/haproxy/restart-only.cfg.tmpl:ro
    environment:
      LOG_LEVEL: warning
    command:
      - /bin/sh
      - -ec
      - |
        rules=
        seen=" "
        index=0
        for name in $${RESTART_TARGETS:-}; do
          case "$${name}" in
            -*|*[!a-zA-Z0-9_.-]*)
              echo "ERROR: invalid restart target name: $${name}" >&2
              exit 64
              ;;
          esac
          case "$${seen}" in
            *" $${name} "*)
              echo "ERROR: duplicate restart target name: $${name}" >&2
              exit 64
              ;;
          esac
          seen="$${seen}$${name} "
          index=$$((index + 1))
          rules="$${rules}    acl restart_target_$${index} path,regsub(^/v[0-9.]+,) -m str /containers/$${name}/restart
            http-request allow if restart_method restart_target_$${index}
        "
        done
        [ "$${index}" -gt 0 ] || {
          echo "ERROR: RESTART_TARGETS must list at least one container" >&2
          exit 64
        }
        awk -v rules="$${rules}" '
          /@RESTART_RULES@/ { printf "%s", rules; next }
          { print }
        ' /usr/local/etc/haproxy/restart-only.cfg.tmpl > /tmp/restart-only.cfg
        exec haproxy -W -db -f /tmp/restart-only.cfg
    networks:
      - docker-api
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:2375/_ping
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
